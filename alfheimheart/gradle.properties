mod_description=Heart of Alfheim, a Botania addon: Botania's work folded into single blocks, each with its own GUI and animations. The Mana Greenhouse grows generating flowers that make mana on their own; the Elven Portal is a whole Alfheim gateway in one block that trades by every elven trade recipe and refines ores. The Runic Altar, the Terrestrial Plate, the Mana Infuser, the Pure Daisy and the Petal Apothecary craft by Botania's recipes from their slots, for mana; the Petal Farm grows petals, the Orechid Mine turns stone into ores and the Crop Field harvests crops.
