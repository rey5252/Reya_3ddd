name: Starfall showcase

# Plays the game on a virtual display: the mod makes a world, fires all three skills and saves screenshots,
# which are committed to starfall/screenshots/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'starfall/src/**'
      - 'starfall/build.gradle'
      - '.github/workflows/starfall-showcase.yml'

concurrency:
  group: starfall-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    defaults:
      run:
        working-directory: starfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Game options
        run: |
          mkdir -p run/config
          cat > run/options.txt <<'OPTS'
          onboardAccessibility:false
          renderDistance:12
          simulationDistance:8
          guiScale:2
          maxFps:30
          graphicsMode:1
          pauseOnLostFocus:false
          tutorialStep:none
          joinedFirstServer:true
          skipMultiplayerWarning:true
          narrator:0
          soundCategory_master:0.0
          OPTS
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
      - name: Play the showcase
        env:
          STARFALL_SHOWCASE: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          chmod +x ./gradlew
          timeout 40m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --stacktrace || echo "client exited with $?"
          ls -la run/screenshots || true
          grep -E "\[showcase\]|Exception|ERROR" run/logs/latest.log | tail -n 120 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starfall-showcase
          path: |
            starfall/run/screenshots/
            starfall/run/logs/latest.log
            starfall/run/crash-reports/
      - name: Commit screenshots
        if: github.event_name != 'pull_request'
        run: |
          ls run/screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 1; }
          mkdir -p screenshots
          rm -f screenshots/*.png
          cp run/screenshots/*.png screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Starfall showcase screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
