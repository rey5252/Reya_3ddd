name: Heart of Alfheim in-game screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'alfheimheart/src/**'
      - 'alfheimheart/build.gradle'
      - 'alfheimheart/gradle.properties'
      - 'alfheimheart/tools/**'
      - '.github/workflows/alfheimheart-screenshots.yml'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: alfheimheart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that the GUI code and its textures agree
        run: for f in tools/*/check_layout.py; do python3 "$f" || exit 1; done
      - name: Versions on the mod mavens
        run: |
          for u in https://maven.blamejared.com/vazkii/botania/Botania/maven-metadata.xml \
                   https://maven.blamejared.com/vazkii/patchouli/Patchouli/maven-metadata.xml \
                   https://maven.theillusivec4.top/top/theillusivec4/curios/curios-forge/maven-metadata.xml; do
            echo "== $u"; curl -s "$u" | grep -o '<version>[^<]*</version>' | tail -n 8 || true
          done
      - name: Install a virtual screen and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Run the game and take screenshots
        env:
          ALFHEIMHEART_AUTOSHOT: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x ./gradlew
          timeout 2400 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew devClasses runClient --stacktrace || true
          ls -la run/screenshots || true
          grep -n -i "alfheimheart\|exception\|error" run/logs/latest.log | grep -v -i "narrator\|realms" | tail -n 120 || true
      - name: Commit screenshots
        run: |
          ls run/screenshots/*.png >/dev/null 2>&1 || exit 0
          rm -rf screenshots && mkdir -p screenshots
          cp run/screenshots/*.png screenshots/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A alfheimheart/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Heart of Alfheim in-game screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
