name: Singularity Fusion in-game tests and screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'singularityfusion/src/**'
      - 'singularityfusion/build.gradle'
      - 'singularityfusion/gradle.properties'
      - 'singularityfusion/tools/**'
      - '.github/workflows/singularityfusion-checks.yml'

jobs:
  gametests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: singularityfusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the layouts, textures and languages
        run: python3 tools/check.py
      - name: Run the game tests
        run: |
          chmod +x ./gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          # a maven that is down for a moment fails the build before the server starts: try once more then
          for attempt in 1 2; do
            if timeout 1500 ./gradlew devClasses runGameTestServer --stacktrace > gametests.log 2>&1; then status=0; else status=$?; fi
            grep -q "GAME TESTS COMPLETE\|tests failed\|required tests passed" gametests.log && break
            echo "The test server didn't run (attempt $attempt)"; tail -n 40 gametests.log; sleep 60
          done
          grep -n -i "gametest\|game test\|tests\? \(passed\|failed\)\|singularityfusion" gametests.log | grep -v -i "narrator" | tail -n 150 || true
          grep -n -A 25 "failed!\|FAILED\|Exception" gametests.log | head -n 300 || true
          exit $status

  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: singularityfusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual screen and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Run the game and take screenshots
        env:
          SINGULARITYFUSION_AUTOSHOT: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x ./gradlew
          for attempt in 1 2; do
            timeout 2400 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew devClasses runClient --stacktrace || true
            ls run/screenshots/*.png >/dev/null 2>&1 && break
            echo "No screenshots after attempt $attempt"; sleep 60
          done
          ls -la run/screenshots || true
          grep -n -i "singularityfusion\|exception\|error" run/logs/latest.log | grep -v -i "narrator\|realms\|openal\|flite" | tail -n 120 || true
          grep -n -A 20 "AutoShot" run/logs/latest.log | head -n 200 || true
          head -n 150 run/crash-reports/*.txt 2>/dev/null || true
      - name: Commit screenshots
        run: |
          ls run/screenshots/*.png >/dev/null 2>&1 || exit 0
          rm -rf screenshots && mkdir -p screenshots
          cp run/screenshots/*.png screenshots/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A singularityfusion/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Singularity Fusion in-game screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
