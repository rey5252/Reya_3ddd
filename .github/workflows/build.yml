name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: cursedseed
            dir: .
          - mod: extraenchants
            dir: extraenchants
          - mod: attributeeditor
            dir: attributeeditor
          - mod: bossdamage
            dir: bossdamage
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-jar
          path: ${{ matrix.dir }}/build/libs/*.jar
