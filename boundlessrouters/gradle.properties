mod_description=Boundless Routers: one block, the Item Router, and modules you plug into it to move items around the world in every way, with no limits on range, dimension, speed or upgrades. Pull items from inventories and send them anywhere, in any dimension; spread them over many targets; drop, fling, place and break blocks; vacuum up dropped items; void what you don't want; reach into a player's inventory; extend drawbridges of blocks; signal redstone when items come. Every module filters what it moves.
