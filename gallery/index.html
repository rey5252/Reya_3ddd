<!--strip--><!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e2042">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Галерея">
<meta name="description" content="Галерея для телефона: фото, відео, альбоми й папки.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!--/strip-->
<title>Галерея Reya</title>
<!--css--><link rel="stylesheet" href="app.css"><!--/css-->
<!--strip--></head>
<body><!--/strip-->
<div id="app">
  <div class="tabview" data-tab="library"></div>
  <div class="tabview" data-tab="albums" hidden></div>
  <div class="tabview" data-tab="search" hidden></div>
  <nav id="tabbar" role="tablist" aria-label="Розділи">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab active" data-tab="library" role="tab" aria-selected="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg><span>Медіатека</span></button>
    <button class="tab" data-tab="albums" role="tab" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="12.5" rx="2.2"/><path d="M6 5h12M8.5 2.5h7"/></svg><span>Альбоми</span></button>
    <button class="tab" data-tab="search" role="tab" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Пошук</span></button>
  </nav>
  <div id="selbar" role="toolbar" aria-label="Дії з вибраним"></div>
</div>

<div id="viewer" hidden>
  <div class="v-bg"></div>
  <div class="v-track"><div class="v-slide"></div><div class="v-slide"></div><div class="v-slide"></div></div>
  <header class="v-bar v-top">
    <button class="v-btn" data-v="close" aria-label="Назад"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg></button>
    <div class="v-title"><b></b><small></small></div>
    <button class="v-btn" data-v="more" aria-label="Ще"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg></button>
  </header>
  <footer class="v-bar v-bottom">
    <div class="v-video" hidden><button class="v-btn" data-v="play" aria-label="Відтворити або пауза"></button><input type="range" id="v-seek" min="0" max="1000" value="0" aria-label="Позиція відео"><span class="v-time">0:00</span></div>
    <div class="v-strip"></div>
    <div class="v-tools main-tools">
      <button data-v="share" aria-label="Поділитися"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11M8 7.5l4-4 4 4"/><path d="M8.5 10.5H7a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5h-1.5"/></svg></button>
      <button data-v="fav" aria-label="Улюблене"></button>
      <button data-v="info" aria-label="Інформація"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.6v.1"/></svg></button>
      <button data-v="del" aria-label="Видалити"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M9.5 6.5v-2h5v2M6.5 6.5l1 13.5h9l1-13.5M10 10.5v6M14 10.5v6"/></svg></button>
    </div>
    <div class="v-tools del-tools" hidden><button data-v="restore">Відновити</button><button class="danger" data-v="purge">Видалити</button></div>
  </footer>
</div>

<div id="overlays"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="drop" hidden>Відпустіть, щоб додати</div>
<div id="splash">
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff5e7e"/><stop offset="1" stop-color="#c2366b"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#sg)"/><circle cx="330" cy="178" r="52" fill="#fff6e0"/><path d="M60 404l124-142 86 92 54-54 128 104v18H60z" fill="#fff" opacity=".95"/><path d="M60 422l124-104 86 66 54-38 128 76" fill="none" stroke="#ffd2dc" stroke-width="10" opacity=".6"/></svg>
  <b>Галерея</b><small></small>
</div>
<input type="file" id="in-files" multiple accept="image/*,video/*" hidden>
<input type="file" id="in-dir" webkitdirectory multiple hidden>
<!--js--><script src="js/core.js"></script>
<script src="js/pages.js"></script>
<script src="js/viewer.js"></script>
<script src="js/import.js"></script>
<script src="js/adult.js"></script>
<script src="js/main.js"></script><!--/js-->
<!--strip--></body>
</html><!--/strip-->
