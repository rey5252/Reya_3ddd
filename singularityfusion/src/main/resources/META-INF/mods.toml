modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="singularityfusion_logo.png"
logoBlur=false
credits="An unofficial addon in the spirit of Draconic Evolution (brandon3055). Uses its items in recipes when it is installed; works without it."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# optional: with it, the top recipes take its chaos shards, dragon hearts and chaotic cores
[[dependencies.${mod_id}]]
    modId="draconicevolution"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
