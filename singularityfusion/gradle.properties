mod_description=Singularity Fusion: an ultra-tier fusion crafting structure in the spirit of Draconic Evolution. A fusion core on a void casing foundation, graviton pylons round it holding the ingredients, and above it a black hole that grows with the energy you pour in: none while empty, half-grown at half charge, vast and wild when full, with an accretion disk, lensed light, lightning, orbiting dark matter and polar jets. Feed it Forge Energy (OP from a Draconic Evolution energy core, RF from anything), load the pylons, and let the singularity fuse them into what lies beyond chaos.
