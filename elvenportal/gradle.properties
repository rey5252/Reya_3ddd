mod_description=Elven Portal, a Botania addon: a whole Alfheim gateway folded into one block. Put items in (or throw them on it) and the elves trade them by every elven trade recipe, Botania's own and any a pack adds: livingwood for dreamwood, manasteel for elementium, mana diamonds for dragonstone... and they refine ores too. It runs on mana from spreaders or from the mana pools beside it, and hoppers and pipes can feed and empty it.
